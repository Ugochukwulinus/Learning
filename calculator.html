<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f4f4f4;
}

.calculator{
    background:#222;
    padding:20px;
    border-radius:15px;
    width:320px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

#display{
    width:100%;
    height:70px;
    font-size:2rem;
    text-align:right;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:60px;
    border:none;
    border-radius:10px;
    font-size:1.3rem;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.number{background:#444;color:white;}
.operator{background:#ff9500;color:white;}
.clear{background:#ff3b30;color:white;}
.equal{background:#34c759;color:white;}
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" autocomplete="off">

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        <button class="operator" onclick="appendValue('*')">*</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="number" onclick="deleteLast()">⌫</button>

        <button class="number" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function appendValue(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function deleteLast(){
    display.value = display.value.slice(0, -1);
}

function calculate(){
    try{
        display.value = Function('"use strict"; return (' + display.value + ')')();
    }catch{
        display.value = "Error";
    }
}

// Only handle special keys.
// Browser handles normal typing naturally.
document.addEventListener("keydown", function(event){

    if(event.key === "Enter" || event.key === "="){
        event.preventDefault();
        calculate();
    }

    if(event.key === "Escape"){
        event.preventDefault();
        clearDisplay();
    }
});
</script>

</body>
</html>
